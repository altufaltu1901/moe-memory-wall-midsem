model:
  model_name: deepseekV3

system:
  gpu_gen: H100 # 80 GiB HBM reference; A100 path lacks a DRAM config in this snapshot
  nvlink_gen: 4
  infiniband_gen: 400
  num_node: 1
  num_device: 1
  processor_type: GPU # disables Logic-PIM
  distribution:
    expert_tensor_degree: 1
    none_expert_tensor_degree: 1
  offchip_experts:
    enabled: on
    bandwidth_GBps: 32 # modeled sustained off-chip DRAM-to-HBM transfer rate
    latency_ns: 2000
    expert_cache_GiB: 32 # HBM budget for routed experts; other data remains local
  optimization:
    parallel_execution: off
    hetero_subbatch: off
    disagg_system: off
    use_low_unit_moe_only: off
    use_ramulator: off
    compressed_kv: on
    use_absorb: on
    use_flash_mla: on
    use_flash_attention: on
    reuse_kv_cache: on
    kv_cache_reuse_rate: 0.0
    prefill_mode: off
    decode_mode: on

serving:
  max_batch_size: 4
  max_process_token: 0

simulation:
  data: synthesis
  input_len: 1024
  output_len: 10
  precision_byte: 1
  skewness: 3.0
  iter: 5
  injection_rate: 0
  exit_out_of_memory: on
  mem_cap_limit: off

log:
  print_log: off
  export_gantt: off
  output_directory: ../data/cache_check
  gantt_directory: ./gantt
