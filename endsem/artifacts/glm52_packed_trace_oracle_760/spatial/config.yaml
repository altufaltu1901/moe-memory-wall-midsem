model:
  model_name: glm5_2
  packed_expert_profile: ../packed_profile.csv

system:
  gpu_gen: H100 # 80 GiB HBM reference; A100 path lacks a DRAM config in this snapshot
  nvlink_gen: 4
  infiniband_gen: 400
  num_node: 1
  num_device: 1
  processor_type: GPU # disables Logic-PIM
  distribution:
    expert_tensor_degree: 1
    none_expert_tensor_degree: 1
  offchip_experts:
    ramulator_channels: 4
    ramulator_sample_ratio: 1024
    prefetch: true
    prefetch_shared: true
    enabled: on
    bandwidth_GBps: 32 # modeled sustained off-chip DRAM-to-HBM transfer rate
    latency_ns: 2000
    expert_cache_GiB: 32 # HBM budget for routed and shared experts
  optimization:
    parallel_execution: off
    hetero_subbatch: off
    disagg_system: off
    use_low_unit_moe_only: off
    use_ramulator: off
    compressed_kv: on
    use_absorb: on
    use_flash_mla: on
    use_flash_attention: on
    reuse_kv_cache: on
    kv_cache_reuse_rate: 0.0
    prefill_mode: off
    decode_mode: on

serving:
  max_batch_size: 1
  max_process_token: 0

simulation:
  data: synthesis
  input_len: 2015
  output_len: 33
  precision_byte: 2
  skewness: 0.0
  iter: 12
  injection_rate: 0
  exit_out_of_memory: on
  mem_cap_limit: off

log:
  print_log: off
  export_gantt: off
  output_directory: ../data/6982270616_s
  gantt_directory: ./gantt
